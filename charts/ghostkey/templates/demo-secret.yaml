{{- if .Values.demo.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ghostkey.fullname" . }}-demo-allowed
  namespace: {{ .Values.demo.namespace }}
  labels:
    {{- include "ghostkey.labels" . | nindent 4 }}
    app.kubernetes.io/component: demo
    ghostkey.io/enabled: "true"
  annotations:
    ghostkey.io/hosts: {{ .Values.demo.secretAllowed.allowedHost | quote }}
type: Opaque
data:
  api-key: {{ .Values.demo.secretAllowed.value | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ghostkey.fullname" . }}-demo-blocked
  namespace: {{ .Values.demo.namespace }}
  labels:
    {{- include "ghostkey.labels" . | nindent 4 }}
    app.kubernetes.io/component: demo
    ghostkey.io/enabled: "true"
  annotations:
    ghostkey.io/hosts: {{ .Values.demo.secretBlocked.allowedHost | quote }}
type: Opaque
data:
  api-key: {{ .Values.demo.secretBlocked.value | b64enc | quote }}
{{- end }}
